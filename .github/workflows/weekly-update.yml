name: Weekly update

on:
  schedule:
    - cron: "33 22 * * 0"   # 每週一 06:33 台北時間（= 週日 22:33 UTC）
  push:                      # 上傳或修改這兩個檔時立刻執行一次
    branches: [main]
    paths:
      - ".github/workflows/weekly-update.yml"
      - "update.py"
  workflow_dispatch:         # 也可在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update data.json from PubMed
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}   # 可不設；有設會查得比較快
        run: python update.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly update $(TZ=Asia/Taipei date +%F)"
            git push
          fi
